<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; block-all-mixed-content" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Permissions-Policy" content="accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" />
    <title>Mini Minecraft</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background-grid" aria-hidden="true"></div>
    <main class="game-shell">
      <header class="top-bar">
        <h1>Mini Minecraft</h1>
        <p>Click canvas to lock mouse, WASD move, mouse look, Space jump, Shift sprint, Left break, Right place, Q cycle block.</p>
      </header>

      <section class="hud">
        <div class="pill">Selected: <span id="selected-block">Grass</span></div>
        <div class="pill">Blocks: <span id="block-count">0</span></div>
        <div class="pill">Tip: Build before sunset.</div>
      </section>

      <section class="canvas-wrap">
        <canvas id="game" width="960" height="540" aria-label="Mini Minecraft game canvas"></canvas>
      </section>

      <section class="legend">
        <div><span class="swatch grass"></span>Grass</div>
        <div><span class="swatch dirt"></span>Dirt</div>
        <div><span class="swatch stone"></span>Stone</div>
        <div><span class="swatch wood"></span>Wood</div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
